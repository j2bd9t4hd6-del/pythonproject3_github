<!-- new_registration.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>新規登録</title>
    <link rel="icon" href="{{ url_for('static', filename='tab_icon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <h1>新規登録</h1>
                <p>アカウントを作成してサービスを始めましょう。</p>
            </div>
            <form method="post" class="auth-form">
                <label class="auth-label">
                    <span>メールアドレス</span>
                    <input class="auth-input" type="email" name="email" required placeholder="example@example.com">
                </label>
                <label class="auth-label">
                    <span>パスワード</span>
                    <input class="auth-input" type="password" name="password" required placeholder="********">
                </label>
                <label class="auth-label">
                    <span>ユーザーネーム（任意）</span>
                    <input class="auth-input" type="text" name="username" placeholder="表示名を入力">
                </label>
                <button type="submit" name="submit_btn" class="auth-button">新規登録</button>
            </form>
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}
            <div class="auth-footer">
                <span>すでにアカウントをお持ちですか？</span>
                <a href="{{ url_for('auth.login') }}">ログイン</a>
            </div>
        </div>
    </div>
</body>
</html>
