<!DOCTYPE html>
<html lang="ja">
<head>
    <link rel="stylesheet"href="{{ url_for('static', filename='signin.css') }}">
    <meta charset="UTF-8">
    <title>Sign In</title>
</head>
<body>
<section class="header">
    <form class="container" method="post">
            <h1>サインイン</h1>

            <div class="form-group is-error1 is-error2 is-required">
                <label class="form-group-label" for="input-user-id">
                    <span class="form-group-label-item">ユーザーIDまたはメールアドレス</span><span class="form-group-required">(必須)</span>
                </label>
                 
                <input class="form-group-input" type="text" id="input-user-id" name="user-id" required placeholder="example@example.com">      
                {% for error in error_user_id %}
                    <p class="error-text1">{{ error }}</p>
                {% endfor %}
            </div>  

            <div class="form-group is-error1 is-error2 is-required">
                <label class="form-group-label" for="input-password">
                    <span class="form-group-label-item">パスワード</span><span class="form-group-required">(必須)</span>
                </label>
                 
                <input class="form-group-input" type="password" id="input-password" name="password" required placeholder="••••••••">      
                {% for error in error_password %}
                    <p class="error-text1">{{ error }}</p>
                {% endfor %}
            </div>  

            <div class="form-group is-error1 is-error2">
                <label class="form-group-label" for="input-favorite-food">
                    <span class="form-group-label-item">好きな食べ物(前にログインした時と変わった場合は入力しましょう!)</span><span class="form-group-required">(必須)</span>
                </label>
                 
                <input class="form-group-input" type="text" id="input-favorite-food" name="favorite-food" placeholder="例:あんかけチャーハン">      
                {% for error in error_favorite_food %}
                    <p class="error-text1">{{ error }}</p>
                {% endfor %}
            </div>  

            <div class="form-group is-error1 is-error2">
                <label class="form-group-label" for="input-hobby">
                    <span class="form-group-label-item">趣味(前にログインした時と変わった場合は入力しましょう!)</span><span class="form-group-required">(必須)</span>
                </label>
                 
                <input class="form-group-input" type="text" id="input-hobby" name="hobby" placeholder="例:読書">      
                {% for error in error_hobby %}
                    <p class="error-text1">{{ error }}</p>
                {% endfor %}
               
            </div>
         <p class="text">アカウントを持っていませんか？<a href="{{ url_for('auth.signup') }}">ここをクリック</a>して新規作成しましょう！</p>
            <button class="submit-button" type="submit"><span class="button-text">サインイン</span></button> 
    </form>
   </section>
</body>
</html>
